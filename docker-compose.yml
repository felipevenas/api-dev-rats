services:
  postgres:
    image: postgres:17-alpine
    container_name: devstreak-postgres
    environment:
      POSTGRES_DB: devstreak
      POSTGRES_USER: devstreak
      POSTGRES_PASSWORD: devstreak
    ports:
      - "55432:5432"
    volumes:
      - devstreak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devstreak -d devstreak"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/devstreak
      DB_USER: devstreak
      DB_PASS: devstreak
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_MODE: ${EMAIL_MODE:-off}
      EMAIL_FROM: "${EMAIL_FROM:-DevRats <onboarding@resend.dev>}"
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_TEST_RECIPIENT: ${EMAIL_TEST_RECIPIENT:-}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-PT10S}
      APP_AUTH_RESET_TOKEN_TTL: ${APP_AUTH_RESET_TOKEN_TTL:-PT30M}
      APP_AUTH_RESET_REQUEST_COOLDOWN: ${APP_AUTH_RESET_REQUEST_COOLDOWN:-PT1M}
    ports:
      - "8080:8080"

volumes:
  devstreak_pgdata:
