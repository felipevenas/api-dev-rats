name: Manage Labels

on:
  push:
    paths:
      - '.github/workflows/labels.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    name: Sync Labels
    runs-on: ubuntu-latest
    steps:
      - name: Sync Repository Labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'feature', color: '0E8A16', description: 'New features and improvements' },
              { name: 'bug', color: 'D93F0B', description: 'Bug fixes and inconsistencies' },
              { name: 'enhancement', color: '1D76DB', description: 'Performance or experience improvements' },
              { name: 'documentation', color: '0075CA', description: 'Documentation and README updates' },
              { name: 'governance', color: '6F42C1', description: 'Guidelines, governance, and automation' },
              { name: 'security', color: 'B60205', description: 'Security audits and fixes' },
              { name: 'ci/cd', color: 'FBCA04', description: 'GitHub Actions workflows and builds' }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (error) {
                if (error.status !== 422) {
                  throw error;
                }

                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }
