spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

app.jwt.secret=${JWT_SECRET}
app.crypto.key=${TOKEN_ENCRYPTION_KEY}
app.cookie.secure=true
app.github.private-key=${GITHUB_PRIVATE_KEY}
app.github.webhook-secret=${GITHUB_WEBHOOK_SECRET}

springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

management.endpoints.web.exposure.include=health,info,prometheus
logging.level.com.devrats=INFO
