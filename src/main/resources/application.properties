spring.application.name=devrats
#---- No default profile: local/dev secrets must never be active by accident in production.
spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.default-property-inclusion=non_null

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.forward-headers-strategy=framework
server.tomcat.max-swallow-size=1MB

#---- The avatar service rejects files above 2 MB with a domain error; the transport limit is
#---- slightly higher so the request reaches the service instead of failing inside the container.
spring.servlet.multipart.max-file-size=${APP_MULTIPART_MAX_FILE_SIZE:3MB}
spring.servlet.multipart.max-request-size=${APP_MULTIPART_MAX_REQUEST_SIZE:4MB}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=devrats

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

app.jwt.issuer=${JWT_ISSUER:devrats-api}
app.jwt.audience=${JWT_AUDIENCE:devrats-web}
app.jwt.access-ttl=${JWT_ACCESS_TTL:PT15M}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:P30D}

app.github.api-url=${GITHUB_API_URL:https://api.github.com}
app.github.oauth-url=${GITHUB_OAUTH_URL:https://github.com/login/oauth}
app.github.app-id=${GITHUB_APP_ID:}
app.github.client-id=${GITHUB_CLIENT_ID:}
app.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.github.app-slug=${GITHUB_APP_SLUG:devstreak}
app.github.private-key=${GITHUB_PRIVATE_KEY:}
app.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
app.github.callback-url=${GITHUB_CALLBACK_URL:http://localhost:8080/api/v1/integrations/github/callback}
app.github.setup-url=${GITHUB_SETUP_URL:http://localhost:8080/api/v1/integrations/github/setup}

app.crypto.key=${TOKEN_ENCRYPTION_KEY:}
app.crypto.key-id=${TOKEN_ENCRYPTION_KEY_ID:1}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

app.groups.max-members=${APP_GROUPS_MAX_MEMBERS:20}
app.challenges.min-target-days=1
app.challenges.max-target-days=365
app.challenges.max-repositories=3
app.challenges.commit-clock-skew=PT5M
app.challenges.max-commit-age=${APP_CHALLENGES_MAX_COMMIT_AGE:PT48H}

app.webhook.max-payload-bytes=1048576
app.webhook.retention-days=${APP_WEBHOOK_RETENTION_DAYS:90}
app.reconciliation.interval=PT10M
app.reconciliation.initial-lookback=P2D
app.reconciliation.page-size=100

app.rate-limit.auth-capacity=10
app.rate-limit.auth-refill=PT1M
app.rate-limit.webhook-capacity=120
app.rate-limit.webhook-refill=PT1M
app.rate-limit.global-capacity=300
app.rate-limit.global-refill=PT1M
app.rate-limit.trust-forwarded-headers=${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}

app.retention.audit-days=${APP_RETENTION_AUDIT_DAYS:730}
app.retention.notification-days=${APP_RETENTION_NOTIFICATION_DAYS:180}

#---- S3-compatible object storage (R2, MinIO, AWS). Empty credentials keep the bean disabled.
app.storage.endpoint=${APP_STORAGE_ENDPOINT:}
app.storage.region=${APP_STORAGE_REGION:auto}
app.storage.bucket=${APP_STORAGE_BUCKET:}
app.storage.access-key=${APP_STORAGE_ACCESS_KEY:}
app.storage.secret-key=${APP_STORAGE_SECRET_KEY:}
app.storage.public-base-url=${APP_STORAGE_PUBLIC_BASE_URL:}
app.storage.key-prefix=${APP_STORAGE_KEY_PREFIX:avatars}
app.storage.max-avatar-bytes=${APP_STORAGE_MAX_AVATAR_BYTES:2097152}
