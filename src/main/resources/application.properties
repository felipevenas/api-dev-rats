spring.application.name=devrats
#---- No default profile: local/dev secrets must never be active by accident in production.
spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.default-property-inclusion=non_null

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.forward-headers-strategy=framework

#---- The avatar service still rejects files above 2 MB with a domain error; the transport limit
#---- is high enough for chat attachments and leaves the per-kind limits to the service.
spring.servlet.multipart.max-file-size=${APP_MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${APP_MULTIPART_MAX_REQUEST_SIZE:30MB}
spring.servlet.multipart.file-size-threshold=2MB
server.tomcat.max-swallow-size=${APP_MULTIPART_MAX_REQUEST_SIZE:30MB}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=devrats

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

app.jwt.issuer=${JWT_ISSUER:devrats-api}
app.jwt.audience=${JWT_AUDIENCE:devrats-web}
app.jwt.access-ttl=${JWT_ACCESS_TTL:PT15M}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:P30D}

app.github.api-url=${GITHUB_API_URL:https://api.github.com}
app.github.oauth-url=${GITHUB_OAUTH_URL:https://github.com/login/oauth}
app.github.app-id=${GITHUB_APP_ID:}
app.github.client-id=${GITHUB_CLIENT_ID:}
app.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.github.app-slug=${GITHUB_APP_SLUG:devrats-app}
app.github.private-key=${GITHUB_PRIVATE_KEY:}
app.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
app.github.callback-url=${GITHUB_CALLBACK_URL:http://localhost:8080/api/v1/integrations/github/callback}
app.github.setup-url=${GITHUB_SETUP_URL:http://localhost:8080/api/v1/integrations/github/setup}

app.crypto.key=${TOKEN_ENCRYPTION_KEY:}
app.crypto.key-id=${TOKEN_ENCRYPTION_KEY_ID:1}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

app.groups.max-members=${APP_GROUPS_MAX_MEMBERS:20}
app.challenges.min-target-days=1
app.challenges.max-target-days=365
app.challenges.max-repositories=3
app.challenges.commit-clock-skew=PT5M
app.challenges.max-commit-age=${APP_CHALLENGES_MAX_COMMIT_AGE:PT48H}

app.webhook.max-payload-bytes=1048576
app.webhook.retention-days=${APP_WEBHOOK_RETENTION_DAYS:90}
app.reconciliation.interval=PT10M
app.reconciliation.initial-lookback=P2D
app.reconciliation.page-size=100

app.rate-limit.auth-capacity=10
app.rate-limit.auth-refill=PT1M
app.rate-limit.webhook-capacity=120
app.rate-limit.webhook-refill=PT1M
app.rate-limit.global-capacity=300
app.rate-limit.global-refill=PT1M
app.rate-limit.search-capacity=${APP_RATE_LIMIT_SEARCH_CAPACITY:60}
app.rate-limit.search-refill=${APP_RATE_LIMIT_SEARCH_REFILL:PT1M}
app.rate-limit.friend-request-capacity=${APP_RATE_LIMIT_FRIEND_REQUEST_CAPACITY:20}
app.rate-limit.friend-request-refill=${APP_RATE_LIMIT_FRIEND_REQUEST_REFILL:PT1H}
app.rate-limit.heartbeat-capacity=${APP_RATE_LIMIT_HEARTBEAT_CAPACITY:60}
app.rate-limit.heartbeat-refill=${APP_RATE_LIMIT_HEARTBEAT_REFILL:PT1M}
app.rate-limit.photo-upload-capacity=${APP_RATE_LIMIT_PHOTO_UPLOAD_CAPACITY:20}
app.rate-limit.photo-upload-refill=${APP_RATE_LIMIT_PHOTO_UPLOAD_REFILL:PT1H}
app.rate-limit.trust-forwarded-headers=${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}

app.friends.max-per-user=${APP_FRIENDS_MAX_PER_USER:1000}
app.friends.max-pending-outgoing=${APP_FRIENDS_MAX_PENDING_OUTGOING:50}
app.friends.declined-cooldown=${APP_FRIENDS_DECLINED_COOLDOWN:PT72H}

app.presence.online-window=${APP_PRESENCE_ONLINE_WINDOW:PT2M}
app.presence.away-window=${APP_PRESENCE_AWAY_WINDOW:PT10M}

app.social.search-per-minute=${APP_SOCIAL_SEARCH_PER_MINUTE:20}
app.social.profile-per-minute=${APP_SOCIAL_PROFILE_PER_MINUTE:60}
app.social.friend-request-per-hour=${APP_SOCIAL_FRIEND_REQUEST_PER_HOUR:10}

app.retention.audit-days=${APP_RETENTION_AUDIT_DAYS:730}
app.retention.notification-days=${APP_RETENTION_NOTIFICATION_DAYS:180}
app.retention.presence-days=${APP_RETENTION_PRESENCE_DAYS:30}
app.retention.social-timeline-days=${APP_RETENTION_SOCIAL_TIMELINE_DAYS:180}

#---- S3-compatible object storage (R2, MinIO, AWS). Empty credentials keep the bean disabled.
app.storage.endpoint=${APP_STORAGE_ENDPOINT:}
app.storage.region=${APP_STORAGE_REGION:auto}
app.storage.bucket=${APP_STORAGE_BUCKET:}
app.storage.access-key=${APP_STORAGE_ACCESS_KEY:}
app.storage.secret-key=${APP_STORAGE_SECRET_KEY:}
app.storage.public-base-url=${APP_STORAGE_PUBLIC_BASE_URL:}
app.storage.key-prefix=${APP_STORAGE_KEY_PREFIX:avatars}
app.storage.max-avatar-bytes=${APP_STORAGE_MAX_AVATAR_BYTES:2097152}

#---- Chat: texto no PostgreSQL, anexos em bucket S3 privado com URL assinada.
app.chat.max-text-chars=${APP_CHAT_MAX_TEXT_CHARS:2000}
app.chat.page-size=${APP_CHAT_PAGE_SIZE:30}
app.chat.max-page-size=${APP_CHAT_MAX_PAGE_SIZE:100}
app.chat.max-image-bytes=${APP_CHAT_MAX_IMAGE_BYTES:8388608}
app.chat.max-voice-bytes=${APP_CHAT_MAX_VOICE_BYTES:16777216}
app.chat.max-file-bytes=${APP_CHAT_MAX_FILE_BYTES:20971520}
app.chat.max-voice-seconds=${APP_CHAT_MAX_VOICE_SECONDS:300}
app.chat.messages-per-minute=${APP_CHAT_MESSAGES_PER_MINUTE:30}
app.chat.uploads-per-minute=${APP_CHAT_UPLOADS_PER_MINUTE:10}
app.chat.typing-throttle=${APP_CHAT_TYPING_THROTTLE:PT2S}
app.chat.attachment-url-ttl=${APP_CHAT_ATTACHMENT_URL_TTL:PT15M}
app.chat.max-sessions-per-user=${APP_CHAT_MAX_SESSIONS_PER_USER:5}
app.chat.storage.bucket=${APP_CHAT_STORAGE_BUCKET:}
app.chat.storage.key-prefix=${APP_CHAT_STORAGE_KEY_PREFIX:chat}

#---- Fotos de estudo: bucket privado separado, uma foto por participante/dia.
app.study-photos.enabled=${APP_STUDY_PHOTOS_ENABLED:true}
app.study-photos.max-image-bytes=${APP_STUDY_PHOTOS_MAX_IMAGE_BYTES:8388608}
app.study-photos.url-ttl=${APP_STUDY_PHOTOS_URL_TTL:PT15M}
app.study-photos.storage.bucket=${APP_STUDY_PHOTOS_STORAGE_BUCKET:}
app.study-photos.storage.key-prefix=${APP_STUDY_PHOTOS_STORAGE_KEY_PREFIX:study-photos}

#---- Cloudflare Turnstile no cadastro/login/recuperação de senha.
app.turnstile.enabled=${APP_TURNSTILE_ENABLED:false}
app.turnstile.site-key=${CLOUDFLARE_TURNSTILE_SITE_KEY:}
app.turnstile.secret-key=${CLOUDFLARE_TURNSTILE_SECRET_KEY:}
app.turnstile.verify-url=${CLOUDFLARE_TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
app.turnstile.timeout=${CLOUDFLARE_TURNSTILE_TIMEOUT:PT5S}
app.turnstile.fail-open=${CLOUDFLARE_TURNSTILE_FAIL_OPEN:false}

#---- Redefinição de senha: validade do link e intervalo mínimo entre pedidos por conta.
app.auth.reset-token-ttl=${APP_AUTH_RESET_TOKEN_TTL:PT30M}
app.auth.reset-request-cooldown=${APP_AUTH_RESET_REQUEST_COOLDOWN:PT1M}

#---- E-mail transacional via Resend. Sem chave ou com EMAIL_MODE=off, o envio fica desligado.
app.email.mode=${EMAIL_MODE:off}
app.email.api-key=${RESEND_API_KEY:}
app.email.base-url=${RESEND_BASE_URL:https://api.resend.com}
app.email.from=${EMAIL_FROM:DevRats <onboarding@resend.dev>}
app.email.reply-to=${EMAIL_REPLY_TO:}
app.email.test-recipient=${EMAIL_TEST_RECIPIENT:}
app.email.timeout=${EMAIL_TIMEOUT:PT10S}
